# On the PUBLIC proxy host: insert into the EXISTING lcj.lychee-nlp2ai.com HTTPS
# server block. Preserve its certificates and existing OpenCodeUI location /.
location = /onlyoffice {
    return 301 /onlyoffice/;
}

location ^~ /onlyoffice/ {
    # Trailing slash strips the /onlyoffice/ prefix before proxying.
    proxy_pass http://100.64.0.5:8092/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $http_host;
    # ONLYOFFICE's official virtual-path proxy format includes the prefix here.
    proxy_set_header X-Forwarded-Host $http_host/onlyoffice;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
    client_max_body_size 100m;
}
